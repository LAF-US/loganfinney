# Only what differs from RenderCV's defaults, and the theme, which RenderCV
# needs whenever design is given
design:
  theme: classic
  # The site's look (styles.css) without its grid: its ink and link colors,
  # left alignment and underlined links, and two of its typefaces, DejaVu Sans
  # for the text and headings and Cousine for the contact line (the site sets
  # its body text in Gelasio). The colors and typefaces are copies of
  # _config.yml's palette and fonts. RenderCV reads the TTF files in fonts/ —
  # the font makers' complete originals, committed beside the WOFF2 files the
  # site serves
  colors:
    body: '#4a4641'
    name: '#131211'
    headline: '#131211'
    connections: '#4a4641'
    section_titles: '#131211'
    links: '#1f4f39'
    footer: '#4a4641'
    top_note: '#4a4641'
  typography:
    alignment: left
    font_family:
      body: DejaVu Sans
      name: DejaVu Sans
      headline: DejaVu Sans
      connections: Cousine
      section_titles: DejaVu Sans
  links:
    underline: true
  header:
    alignment: left
    connections:
      show_icons: false
      separator: ·
  section_titles:
    type: with_full_line
