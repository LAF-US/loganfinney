<address>
    <dl>
        {%- if site.contact.email %}
        <div><dt>Email</dt> <dd><a class="u-email" href="mailto:{{ site.contact.email }}">{{ site.contact.email }}</a></dd></div>
        {%- endif %}
        {%- if site.contact.signal %}
        <div><dt>Signal</dt> <dd><a rel="noopener noreferrer" href="{{ site.contact.signal.url }}">{{ site.contact.signal.handle }}</a></dd></div>
        {%- endif %}
        {%- if site.contact.whatsapp %}
        <div><dt>WhatsApp</dt> <dd><a rel="noopener noreferrer" href="{{ site.contact.whatsapp.url }}">{{ site.contact.whatsapp.handle }}</a></dd></div>
        {%- endif %}
    </dl>
</address>
