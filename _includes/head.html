    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="{{ site.palette.blue-dark }}" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="{{ site.palette.blue-light }}" media="(prefers-color-scheme: dark)">
    {%- include seo.html %}
    <link rel="author" href="{{ '/humans.txt' | relative_url }}">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
    {%- for profile in site.data._profiles %}
    <link rel="me" href="{{ profile.url | escape }}">
    {%- endfor %}
    <script src="{{ '/theme.js' | relative_url }}"></script>
    {%- for font in site.fonts %}{% for face in font[1].files %}{% if face.preload %}
    <link rel="preload" href="{{ '/fonts/' | append: face.file | relative_url }}" as="font" type="font/woff2" crossorigin>
    {%- endif %}{% endfor %}{% endfor %}
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <script src="{{ '/config.js' | relative_url }}" defer></script>
    <script src="{{ '/fire.js' | relative_url }}" defer></script>
