    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {%- include seo.html %}
    <script>
        // Runs before the stylesheet applies so a stored theme never flashes the wrong colors
        try {
            var t = sessionStorage.getItem('theme');
            if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>
    <link rel="preload" href="fonts/dejavu-sans.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/dejavu-sans-bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
