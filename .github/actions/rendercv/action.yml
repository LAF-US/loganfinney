name: Set up RenderCV
description: Python and the packages in .github/requirements.txt, for both jobs in .github/workflows/jekyll-gh-pages.yml that render cv.yaml
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"
    - name: Install RenderCV, fontTools, resvg-py and Pillow (versions in .github/requirements.txt)
      shell: bash
      run: pip install -r .github/requirements.txt
