version: 2
# Waits 7 days after a release before proposing it, so a tampered release
# is likelier to be caught and pulled first. One pull request per update, so
# one that fails can't hold back the rest. Minor and patch updates merge
# themselves once the site's build and tests pass; major updates and updates
# to the workflow's actions wait for a person (the merge-update job in
# .github/workflows/jekyll-gh-pages.yml)
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /.github/tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
