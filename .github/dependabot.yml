version: 2
# Waits 7 days after a release before proposing it, so a tampered release
# is likelier to be caught and pulled first
updates:
  - package-ecosystem: github-actions
    # The workflows, and the local actions they use
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /.github/tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
