name: Refresh CV

# Time alone can put the published site out of date: RenderCV counts the
# length of each entry that ends "present" (like "3 years 5 months") up to the
# day it renders, and the footer's copyright range ends at the build year.
# Once a day this renders the CV as of the last publish and as of today. If
# the two differ, or the year has turned, it starts the deploy workflow
# (jekyll-gh-pages.yml), the same as running it by hand; otherwise it stops.

on:
  schedule:
    # 15:17 UTC is mid-morning in Idaho, so the date is the same in UTC and in
    # both of Idaho's time zones
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the deploy workflow's past runs and start a new one
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install RenderCV (versions in .github/requirements.txt)
        run: pip install -r .github/requirements.txt
      - name: Start the deploy workflow if the CV has changed since the last publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow jekyll-gh-pages.yml --branch main --status success --limit 1 \
            --json createdAt --jq '.[0].createdAt // "" | .[:10]')
          today=$(date -u +%F)
          if [ -z "$last" ]; then
            echo "No published build found"
          elif [ "${last:0:4}" != "${today:0:4}" ]; then
            echo "The year has turned since the last publish ($last)"
          else
            for date in "$last" "$today"; do
              rendercv render cv.yaml --settings.current_date "$date" -nopdf -nopng -nohtml -o "$RUNNER_TEMP/$date" >/dev/null
            done
            if diff "$RUNNER_TEMP/$last/Logan_Finney_CV.md" "$RUNNER_TEMP/$today/Logan_Finney_CV.md"; then
              echo "The CV reads the same as at the last publish ($last)"
              exit 0
            fi
          fi
          gh workflow run jekyll-gh-pages.yml --ref main
