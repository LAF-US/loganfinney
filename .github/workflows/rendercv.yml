name: RenderCV

# Runs RenderCV on cv.yaml and commits the CV the site shows
# (_includes/rendercv.html, via scripts/rendercv-include.py).
# Runs when cv.yaml or the script changes, every day (RenderCV's durations,
# like "10 months", count up to the day it runs, so they stay current; a commit
# is made only when the text changes), and by hand from the Actions tab.

on:
  push:
    paths:
      - cv.yaml
      - scripts/rendercv-include.py
      - .github/workflows/rendercv.yml
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install RenderCV
        run: pip install "rendercv==2.8"
      - name: Render the CV (HTML only)
        run: rendercv render cv.yaml -nopdf -nopng -notyp -o "$RUNNER_TEMP/rendercv"
      - name: Put RenderCV's HTML on the site
        run: python3 scripts/rendercv-include.py "$RUNNER_TEMP/rendercv/Logan_Finney_CV.html"
      - name: Commit if the CV changed
        run: |
          git diff --quiet -- _includes/rendercv.html && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _includes/rendercv.html
          git commit -m "Render the CV with RenderCV"
          git push
