name: RenderCV

on:
  push:
    branches: ["**"]
  schedule:
    # Daily, so date-derived text ("Last updated", durations ending "present")
    # stays current: a render that changes nothing commits nothing, and the
    # site workflow runs after each run on main.
    # 15:17 UTC is mid-morning in Idaho, so the date is the same in UTC and in
    # both of Idaho's time zones
    - cron: "17 15 * * *"

permissions:
  contents: read

concurrency:
  group: rendercv-${{ github.ref }}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install "rendercv[full]==2.8"
      - run: rendercv render cv.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendercv-output
          path: rendercv_output/

  save:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rm -rf rendercv_output
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rendercv-output
          path: rendercv_output/
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rendercv_output/
          if ! git diff --cached --quiet; then
            git commit -m "Save RenderCV's output"
            git push
          fi
