name: Build and publish the site

# Builds loganfinney.com and publishes it to GitHub Pages (Settings → Pages →
# Source: GitHub Actions): renders the CV from cv.yaml with RenderCV, builds
# the site with Jekyll, checks its own links and images, tests it against
# WCAG AAA, and publishes the result.
# If any step fails, nothing is published and the live site keeps its last
# good version.
#
# It runs on each push to main; daily, so the CV's date-derived text ("Last
# updated", durations ending "present") stays current; by hand from the
# Actions tab; and on pull requests, short of publishing, so each proposed
# change (Dependabot's included) is tested before it is merged.
#
# It looks after itself between a person's visits: Dependabot's minor and
# patch updates merge themselves once tested, the daily run keeps itself
# switched on, a failed daily run opens an issue for the site's owner, and
# each publish asks the Wayback Machine to save the pages the CV links to.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 15:17 UTC is mid-morning in Idaho, so the date is the same in UTC and in
    # both of Idaho's time zones
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Every pip install takes only versions uploaded at least 7 days ago, the same
# wait Dependabot keeps (.github/dependabot.yml), including the packages that
# no file pins because the pinned ones bring them in. pip 26.1 and newer
# follow this, and the runner's Python comes with one; older ones ignore it
env:
  PIP_UPLOADED_PRIOR_TO: P7D

# One run at a time per branch. A newer run waits its turn: it neither cancels
# one that has started nor replaces one already waiting (by default GitHub
# keeps only one waiting run, so a daily run could replace a waiting push,
# and that push's changes wouldn't be published)
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install RenderCV (version in .github/requirements.txt)
        run: pip install -r .github/requirements.txt
      - name: Install Ruby and the site's Jekyll and plugins (versions in Gemfile.lock)
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # The PDF goes straight to cv.pdf, and the Markdown to
      # _includes/rendercv.md for index.md.txt and llms-full.txt to include
      # (cv.yaml's pdf_path and markdown_path)
      - name: Render the CV from cv.yaml (RenderCV)
        run: rendercv render cv.yaml
      # RenderCV's own HTML, the CV inside its <article class="markdown-body">,
      # unchanged, for index.html to include. raw keeps Jekyll from reading the
      # CV's text as template code. If RenderCV's HTML has no such article,
      # this stops, rather than publish the site without its CV
      - name: Put the CV on the home page
        run: |
          grep -q '<article class="markdown-body">' rendercv_output/*.html
          { echo '{% raw %}'; sed -n '/<article class="markdown-body">/,/<\/article>/p' rendercv_output/*.html | sed '1d;$d'; echo '{% endraw %}'; } > _includes/rendercv.html
      - name: Build the site (Jekyll)
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}
      # Every link, image and script on the site's own pages, and each page's
      # link-preview image, must exist in the built site. Addresses on the
      # site's own domain are checked as files here; links to other sites
      # aren't checked
      - name: Check the site's own links and images (html-proofer, version in Gemfile.lock)
        run: bundle exec htmlproofer _site --disable-external --checks Links,Images,Scripts,OpenGraph --swap-urls '^https\://loganfinney\.com:'
      - name: Serve built site
        run: |
          (python3 -m http.server 8000 -d _site >/dev/null 2>&1 &)
          timeout 30 bash -c 'until curl -sf http://localhost:8000/ >/dev/null; do sleep 0.5; done'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install pa11y-ci (exact versions from .github/tests/package-lock.json)
        working-directory: .github/tests
        run: npm ci --ignore-scripts
      - name: Confirm the runner has Chrome
        run: test -x /usr/bin/google-chrome || { echo "::error::Google Chrome is missing from the runner image at /usr/bin/google-chrome"; exit 1; }
      - name: Test the home and 404 pages against WCAG AAA (pa11y-ci, settings in .github/tests/.pa11yci.json)
        working-directory: .github/tests
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm test
      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site
          # .well-known starts with a dot
          include-hidden-files: true

  deploy:
    # Publishes main only, never a pull request's test build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # After each publish, the Internet Archive's Wayback Machine saves the home
  # page and the pages it links to (the first 100), so the CV's links still
  # lead somewhere if a story is taken down. A link saved in the last 30 days
  # isn't saved again. It needs a free archive.org account's keys
  # (archive.org/account/s3.php) as the repository secrets
  # ARCHIVE_ORG_ACCESS_KEY and ARCHIVE_ORG_SECRET_KEY; without them it does
  # nothing. If the archive can't take the request, the run shows a warning,
  # not a failure, and the next publish tries again
  archive-links:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ask the Wayback Machine to save the site and its outgoing links
        env:
          ACCESS_KEY: ${{ secrets.ARCHIVE_ORG_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.ARCHIVE_ORG_SECRET_KEY }}
        run: |
          if [ -z "$ACCESS_KEY" ] || [ -z "$SECRET_KEY" ]; then
            echo "::notice::Nothing saved: add the ARCHIVE_ORG_ACCESS_KEY and ARCHIVE_ORG_SECRET_KEY secrets to switch this on"
            exit 0
          fi
          # The Wayback Machine's Save Page Now: the home page unless saved in
          # the last hour, each linked page unless saved in the last 30 days
          api() { curl -sS -H "Accept: application/json" -H "Authorization: LOW $ACCESS_KEY:$SECRET_KEY" "$@" || true; }
          response=$(api --retry 3 --max-time 60 -X POST https://web.archive.org/save --data-urlencode "url=https://loganfinney.com/" -d capture_outlinks=1 -d if_not_archived_within=1h,30d)
          job=$(jq -r '.job_id // empty' <<< "$response" 2>/dev/null || true)
          if [ -z "$job" ]; then
            reason=$(jq -r '.message // .status_ext // empty' <<< "$response" 2>/dev/null || head -c 300 <<< "$response")
            echo "::warning::The Wayback Machine didn't take the request: ${reason:-no answer}"
            exit 0
          fi
          # The home page is saved first, then the pages it links to; wait
          # about 2 minutes for the home page
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            sleep 5
            status=$(api --max-time 15 "https://web.archive.org/save/status/$job")
            case $(jq -r '.status // empty' <<< "$status" 2>/dev/null || true) in
              success)
                echo "Saved $(jq -r '"https://web.archive.org/web/\(.timestamp)/\(.original_url)"' <<< "$status"); $(jq '.outlinks | length' <<< "$status") linked pages are being saved"
                exit 0 ;;
              error)
                echo "::warning::The Wayback Machine couldn't save the site: $(jq -r '.message // .status_ext' <<< "$status")"
                exit 0 ;;
            esac
          done
          echo "The Wayback Machine is still saving the site after 2 minutes, and carries on by itself"

  # Dependabot's minor and patch updates to the build tools merge themselves
  # once the build and tests above have passed, then publish. Major updates,
  # and updates that change this workflow (what runs with write access), wait
  # for a person. The pull request's code is never checked out here
  merge-update:
    needs: build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Merge the update if it is a minor or patch update to a build tool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A lookup that fails stops this step, so nothing merges
          set -o pipefail
          # The pull request's number, from its ref: refs/pull/<number>/merge
          number=${GITHUB_REF#refs/pull/}
          number=${number%/merge}
          pr=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$number
          # The build tested GitHub's trial merge of the pull request
          # ($GITHUB_SHA), whose second parent is the pull request's latest
          # commit. Only that commit may merge; a newer one waits for its own run
          tested=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.parents[1].sha')
          # Every page of commits, not only the first 30
          commits=repos/$GITHUB_REPOSITORY/pulls/$number/commits
          authors=$(gh api --paginate "$commits" --jq '.[].author.login' | sort -u | paste -sd ' ' -)
          # Dependabot describes each update in its commit message, with one
          # "update-type:" line per dependency
          types=$(gh api --paginate "$commits" --jq '.[].commit.message' | sed -n 's/^ *update-type: //p' | sort -u)
          files=$(gh pr diff "$pr" --name-only)
          workflows=$(grep '^\.github/workflows/' <<< "$files" || true)
          echo "Commits by: $authors"
          echo "Update types: ${types:-none given}"
          if [ "$authors" != "dependabot[bot]" ]; then
            echo "Waits for a person: not every commit is Dependabot's"
          elif [ -n "$workflows" ]; then
            echo "Waits for a person: it changes $workflows"
          elif [ -z "$types" ] || grep -qv -e '^version-update:semver-minor$' -e '^version-update:semver-patch$' <<< "$types"; then
            echo "Waits for a person: not only minor and patch updates"
          else
            gh pr merge --merge --match-head-commit "$tested" "$pr"
            # A merge made with this job's token starts no run of its own
            # (only a by-hand run does), so main would wait for the next daily
            # run to publish. This starts that run now
            gh workflow run jekyll-gh-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi

  # GitHub switches off a public repository's scheduled runs after 60 days
  # without activity. Re-enabling this workflow on each daily run resets that
  # count (as keepalive workflows rely on; GitHub's docs don't say), so the
  # daily check keeps running however long the repository sits untouched
  keep-scheduled:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable the daily run
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/jekyll-gh-pages.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A failed daily run opens an issue assigned to the site's owner, or adds to
  # the one already open, so a person hears of it. GitHub's own email for a
  # scheduled run goes to whoever last edited its cron line, who may not be
  # the owner
  report-failure:
    needs: [build, deploy, keep-scheduled]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or add to the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The daily site build failed"
          issue=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "It failed again: $RUN"
          else
            # loganfinney27 is the site's owner, as in .github/CODEOWNERS
            gh issue create --title "$title" --assignee loganfinney27 --body "The daily check of loganfinney.com failed, so nothing new was published; the live site still shows its last good version. What happened: $RUN. Close this issue once it's fixed."
          fi
