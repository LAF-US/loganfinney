name: Build and publish the site

# Builds loganfinney.com and publishes it to GitHub Pages (Settings → Pages →
# Source: GitHub Actions): renders the CV from cv.yaml with RenderCV, builds
# the site with Jekyll, tests it against WCAG AAA, and publishes the result.
# If any step fails, nothing is published and the live site keeps its last
# good version.
#
# It runs on each push to main; daily, to check whether the CV's date-derived
# text ("Last updated", durations ending "present") has rolled over, publishing
# only if the CV changed; by hand from the Actions tab; and on pull requests,
# short of publishing, so each proposed change (Dependabot's included) is
# tested before it is merged.
#
# It looks after itself between a person's visits: Dependabot's minor and
# patch updates merge themselves once tested, the daily run keeps itself
# switched on, and a failed daily run opens an issue for the site's owner.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 15:17 UTC is mid-morning in Idaho, so the date is the same in UTC and in
    # both of Idaho's time zones
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Every pip install takes only versions uploaded at least 7 days ago, the same
# wait Dependabot keeps (.github/dependabot.yml), including the packages that
# no file pins because the pinned ones bring them in. pip 26.1 and newer
# follow this, and the runner's Python comes with one; older ones ignore it
env:
  PIP_UPLOADED_PRIOR_TO: P7D

# One run at a time per branch; a newer run waits rather than cancelling one
# that has started
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      cv-changed: ${{ steps.cv.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install RenderCV, resvg-py and Pillow (versions in .github/requirements.txt)
        run: pip install -r .github/requirements.txt
      - name: Render the CV from cv.yaml
        run: rendercv render cv.yaml
      - name: Copy the site's facts from cv.yaml for Jekyll (_config.cv.yml)
        run: python3 .github/scripts/cv-settings.py
      # The daily run checks first: it publishes only if the CV's text differs
      # from the live site's copy, through an edit or a date rolling over. The
      # PDF's text is compared through its Typst source, because the PDF file
      # carries the day it was made. A live copy that can't be fetched counts
      # as a change
      - name: Check whether the CV changed since the live site was built (daily run only)
        id: cv
        if: github.event_name == 'schedule'
        run: |
          site=$(python3 -c "from ruamel.yaml import YAML; print(YAML(typ='safe').load(open('_config.cv.yml'))['url'])")
          changed=false
          for file in rendercv_output/*.md rendercv_output/*.typ; do
            if ! curl -fsS "$site/rendercv_output/${file##*/}" -o "$RUNNER_TEMP/live" || ! cmp -s "$file" "$RUNNER_TEMP/live"; then
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "The CV changed since the live site was built: $changed"
      - name: Draw the favicon and app icons from favicon.svg
        run: python3 .github/scripts/icons.py
      - name: Put the CV on the site, and its PDF at /cv.pdf
        run: |
          python3 .github/scripts/rendercv-include.py rendercv_output/*.html
          cp rendercv_output/*.pdf cv.pdf
      - name: Install Ruby and the site's Jekyll and plugins (versions in Gemfile.lock)
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # The github-pages gem builds the way GitHub Pages does; the second
      # settings file carries the facts from cv.yaml
      - name: Build the site
        run: bundle exec jekyll build --config _config.yml,_config.cv.yml
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}
      - name: Serve built site
        run: |
          (python3 -m http.server 8000 -d _site >/dev/null 2>&1 &)
          timeout 30 bash -c 'until curl -sf http://localhost:8000/ >/dev/null; do sleep 0.5; done'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install pa11y-ci (exact versions from .github/tests/package-lock.json)
        working-directory: .github/tests
        run: npm ci --ignore-scripts
      - name: Confirm the runner has Chrome
        run: test -x /usr/bin/google-chrome || { echo "::error::Google Chrome is missing from the runner image at /usr/bin/google-chrome"; exit 1; }
      - name: Test the home and 404 pages against WCAG AAA (pa11y-ci, settings in .github/tests/.pa11yci.json)
        working-directory: .github/tests
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm test
      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site
          # .well-known starts with a dot
          include-hidden-files: true

  deploy:
    # Publishes main only, never a pull request's test build, and on the daily
    # run only if the CV changed
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.cv-changed != 'false' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Dependabot's minor and patch updates to the build tools merge themselves
  # once the build and tests above have passed. Major updates, and updates
  # that change this workflow (what runs with write access), wait for a
  # person. The pull request's code is never checked out here
  merge-update:
    needs: build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the update if it is a minor or patch update to a build tool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A lookup that fails stops this step, so nothing merges
          set -o pipefail
          # The pull request's number, from its ref: refs/pull/<number>/merge
          number=${GITHUB_REF#refs/pull/}
          number=${number%/merge}
          pr=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$number
          # The build tested GitHub's trial merge of the pull request
          # ($GITHUB_SHA), whose second parent is the pull request's latest
          # commit. Only that commit may merge; a newer one waits for its own run
          tested=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.parents[1].sha')
          # Every page of commits, not only the first 30
          commits=repos/$GITHUB_REPOSITORY/pulls/$number/commits
          authors=$(gh api --paginate "$commits" --jq '.[].author.login' | sort -u | paste -sd ' ' -)
          # Dependabot describes each update in its commit message, with one
          # "update-type:" line per dependency
          types=$(gh api --paginate "$commits" --jq '.[].commit.message' | sed -n 's/^ *update-type: //p' | sort -u)
          files=$(gh pr diff "$pr" --name-only)
          workflows=$(grep '^\.github/workflows/' <<< "$files" || true)
          echo "Commits by: $authors"
          echo "Update types: ${types:-none given}"
          if [ "$authors" != "dependabot[bot]" ]; then
            echo "Waits for a person: not every commit is Dependabot's"
          elif [ -n "$workflows" ]; then
            echo "Waits for a person: it changes $workflows"
          elif [ -z "$types" ] || grep -qv -e '^version-update:semver-minor$' -e '^version-update:semver-patch$' <<< "$types"; then
            echo "Waits for a person: not only minor and patch updates"
          else
            gh pr merge --merge --match-head-commit "$tested" "$pr"
          fi

  # GitHub switches off a public repository's scheduled runs after 60 days
  # without activity. Re-enabling this workflow on each daily run resets that
  # count (as keepalive workflows rely on; GitHub's docs don't say), so the
  # daily check keeps running however long the repository sits untouched
  keep-scheduled:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable the daily run
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/jekyll-gh-pages.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A failed daily run opens an issue assigned to the site's owner, or adds to
  # the one already open, so a person hears of it. GitHub's own email for a
  # scheduled run goes to whoever last edited its cron line, who may not be
  # the owner
  report-failure:
    needs: [build, deploy, keep-scheduled]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or add to the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The daily site build failed"
          issue=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "It failed again: $RUN"
          else
            # loganfinney27 is the site's owner, as in .github/CODEOWNERS
            gh issue create --title "$title" --assignee loganfinney27 --body "The daily check of loganfinney.com failed, so nothing new was published; the live site still shows its last good version. What happened: $RUN. Close this issue once it's fixed."
          fi
