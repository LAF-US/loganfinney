name: Deploy Jekyll with GitHub Pages dependencies preinstalled

# Builds loganfinney.com and publishes it to GitHub Pages (Settings → Pages →
# Source: GitHub Actions). The CV itself is rendered by one workflow only
# (.github/workflows/rendercv.yml), which commits the result to
# rendercv_output/; this workflow consumes that committed output, builds the
# site with Jekyll, tests it against WCAG AAA, and publishes the result. If
# any step fails, nothing is published and the live site keeps its last good
# version.
#
# It runs after each RenderCV run on main — a push, or the daily render that
# keeps date-derived text current — and on pull requests, short of
# publishing, so each proposed change (Dependabot's included) is tested
# before a person merges it.

on:
  workflow_run:
    workflows: [RenderCV]
    types: [completed]
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every pip install takes only versions uploaded at least 7 days ago, the same
# wait Dependabot keeps (.github/dependabot.yml), including the packages that
# no file pins because the pinned ones bring them in. pip 26.1 and newer
# follow this, and the runner's Python comes with one; older ones ignore it
env:
  PIP_UPLOADED_PRIOR_TO: P7D

# One run at a time per branch; a newer run waits rather than cancelling one
# that has started
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # On workflow_run, only after a RenderCV run that succeeded
    if: ${{ github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install resvg-py and Pillow (versions in .github/requirements.txt)
        run: pip install -r .github/requirements.txt
      - name: Draw the favicon and app icons from favicon.svg
        run: python3 .github/scripts/icons.py
      - name: Put the committed CV on the site, and its PDF at /cv.pdf
        run: |
          python3 .github/scripts/rendercv-include.py rendercv_output/*.html
          cp rendercv_output/*.pdf cv.pdf
      - name: Build site (same as GitHub Pages)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site
      - name: Serve built site
        run: |
          (python3 -m http.server 8000 -d _site >/dev/null 2>&1 &)
          timeout 30 bash -c 'until curl -sf http://localhost:8000/ >/dev/null; do sleep 0.5; done'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install pa11y-ci (exact versions from .github/tests/package-lock.json)
        working-directory: .github/tests
        run: npm ci --ignore-scripts
      - name: Confirm the runner has Chrome
        run: test -x /usr/bin/google-chrome || { echo "::error::Google Chrome is missing from the runner image at /usr/bin/google-chrome"; exit 1; }
      - name: Test the home and 404 pages against WCAG AAA (pa11y-ci, settings in .github/tests/.pa11yci.json)
        working-directory: .github/tests
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm test
      - name: Package the site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site
          # .well-known starts with a dot
          include-hidden-files: true

  deploy:
    # Publishes on the main chain only, never for a pull request's test build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'workflow_run' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
