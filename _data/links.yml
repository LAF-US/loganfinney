# Home page link tabs, in order. The first tab is selected on load.
# Profile tabs list networks by name; each URL comes from basics.profiles in _data/resume.json,
# and each icon is the network name in lowercase with spaces as hyphens (_includes/icons/).
tabs:
  - id: meet
    label: Meet
    buttons:
      - label: Resume
        url: "resume.html"
      - label: Folio
        url: "resume.html#folio"
      - label: Latest
        url: "https://thegemstone.org"
        external: true
  - id: post
    label: Post
    profiles:
      - "Facebook"
      - "Instagram"
      - "Threads"
      - "Bluesky"
      - "X"
      - "Mastodon"
      - "LinkedIn"
  - id: view
    label: View
    profiles:
      - "Twitch"
      - "TikTok"
      - "Vimeo"
      - "YouTube"
      - "Flickr"
      - "SoundCloud"
      - "Spotify"
  - id: find
    label: Find
    profiles:
      - "IMDb"
      - "Muck Rack"
      - "Authory"
      - "Linktree"
      - "Letterboxd"
      - "Goodreads"
      - "GitHub"
  - id: tip
    label: Tip
    support: true
    profiles:
      - "PayPal"
      - "Cash App"
      - "Venmo"
      - "Ko-fi"
      - "Buy Me a Coffee"
      - "Patreon"
      - "Stripe"
